<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Game</title>
  <style>
    canvas.board {
      border: 1px solid black;
      position: absolute;
      top: 0;
      left: 0;
      zoom: 1;
    }

    img {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
  </style>
  <!--<script type="module" src="/src/main.ts"></script>-->
</head>

<body>
  <div style="margin: auto">
    <canvas class="board" style="z-index:10" id="grid"></canvas>
    <canvas class="board" style="z-index:5" id="player"></canvas>
    <canvas class="board" style="z-index:3" id="doodads"></canvas>
    <canvas class="board" id="background"></canvas>
  </div>

  <script type="module" src="/src/main.ts"></script>


</body>

</html>
