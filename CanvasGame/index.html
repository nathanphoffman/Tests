<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Game</title>
  <style>
    canvas {
      border: 1px solid black;
      display: block;
      margin: 0 auto;    
      position: absolute;
    top: 0;
    left: 0;
    }
  </style>
  <!--<script type="module" src="/src/main.ts"></script>-->
</head>

<body>
  <div>
    <canvas style="z-index:10" id="gameCanvas" width="800" height="600"></canvas>
    <canvas id="gameCanvas2" width="800" height="600"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let x = 0; // Starting x position
    let y = 50; // Starting y position
    const targetX = 300; // Target x position
    const targetY = 50; // Target y position
    const MOVE_AMOUNT = 25;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
      ctx.fillStyle = 'blue'; // Set color
      ctx.fillRect(x, y, 10, 10); // Draw point

      // Update position
      if (x < targetX) x += 2; // Move towards target
      requestAnimationFrame(animate); // Call next frame
    }

    //animate(); // Start animation


    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 25,
      color: 'blue'
    };

    const canvas2 = document.getElementById('gameCanvas2');
    const ctx2 = canvas2.getContext('2d');

    function drawLine(start, end) {
      // Define a new path
      ctx2.beginPath();

      // Set a start-point
      ctx2.moveTo(...start);

      // Set an end-point
      ctx2.lineTo(...end);

      ctx2.lineWidth = 1;
      ctx2.strokeStyle = "#aaa"

      // Stroke it (Do the Drawing)
      ctx2.stroke();
    }

    
    const loops_x = Math.floor(600/25);
    const loops_y = Math.floor(800/25);
    
    [...new Array(loops_x)].forEach((x,i)=>drawLine([0,(i+1)*25],[800, (i+1)*25]));
    [...new Array(loops_y)].forEach((x,i)=>drawLine([(i+1)*25, 0],[(i+1)*25, 600]));


    //drawLine();

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.size, player.size);
    }

    function getCanvasPosition() {
      const rect = canvas.getBoundingClientRect()
      const x = event.clientX - rect.left - player.size / 2.25
      const y = event.clientY - rect.top - player.size / 2.25
      return [x, y]
    }


    let currentMoveTo = [];

    function moveToCurrent() {
      const [x1, y1] = [player.x, player.y];
      const [x2, y2] = currentMoveTo;

      console.log([x1, y1], [x2, y2]);

      const MOVE_ERROR = MOVE_AMOUNT / 2;

      if (x1 - MOVE_ERROR > x2) player.x -= MOVE_AMOUNT;
      if (x1 + MOVE_ERROR < x2) player.x += MOVE_AMOUNT;
      if (y1 - MOVE_ERROR > y2) player.y -= MOVE_AMOUNT;
      if (y1 + MOVE_ERROR < y2) player.y += MOVE_AMOUNT;


    }


    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (currentMoveTo.length > 0) moveToCurrent();
      drawPlayer();
      requestAnimationFrame(() => setTimeout(gameLoop, 100));
    }



    function resetMove() {
      currentMoveTo = [];
    }



    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
          player.y -= MOVE_AMOUNT;
          resetMove();
          break;
        case 'ArrowDown':
          player.y += MOVE_AMOUNT;
          resetMove();
          break;
        case 'ArrowLeft':
          player.x -= MOVE_AMOUNT;
          resetMove();
          break;
        case 'ArrowRight':
          player.x += MOVE_AMOUNT;
          resetMove();
          break;
      }
    });

    canvas.addEventListener('click', (e) => {
      currentMoveTo = getCanvasPosition()
      console.log("clicked at ", currentMoveTo)
      console.log("x: " + x + " y: " + y)
    });

    gameLoop();
  </script>
</body>

</html>
